title: "gh openspec create — New Repo Creation"
slug: "create-command"
type: feature
status: approved

author: "arananet"
created_at: "2026-04-15"
updated_at: "2026-04-17"

description: |
  The `create` subcommand creates a new GitHub repository using the
  `arananet/openspec-template` GitHub template repo, then applies project-specific
  substitutions and pushes the configuration commit. This leaves the developer
  with a fully-wired repo ready for the AI onboarding wizard.

acceptance_criteria:
  - "Given a valid repo name, when `gh openspec create <name>` runs, then a new GitHub repo is created under the authenticated user's account using the arananet/openspec-template template."
  - "Given repo creation succeeds with --clone (default), then all template files are present in the local clone."
  - "Given template files are cloned, then all {{PROJECT_NAME}}, {{GITHUB_OWNER}}, and {{DATE}} tokens are substituted with actual values."
  - "Given substitution produces changes, then a configuration commit is pushed to the remote default branch."
  - "Given the command completes, then next-step instructions are printed including the Claude Code onboarding prompt."
  - "Given an invalid repo name (special chars), then the command exits with error before creating anything."
  - "Given --public flag is passed, then the repo is created as public."
  - "Given --no-clone flag is passed, then the repo is created on GitHub only with no local clone."

out_of_scope:
  - "Organization repo creation (planned for v0.2)"

technical_notes: |
  Uses `gh repo create --template arananet/openspec-template` so the initial commit
  with all template files is created by GitHub. A second commit applies
  project-specific token substitutions. Push uses `git push -u origin HEAD` to
  support any default branch name.

