title: "gh openspec scaffold — Create Feature Spec File"
slug: "scaffold-command"
type: feature
status: approved

author: "arananet"
created_at: "2026-04-15"
updated_at: "2026-04-15"

description: |
  The `scaffold` subcommand creates a new spec file under `.openspec/specs/`
  from the appropriate template. It slugifies the feature name, copies the
  template, applies token substitutions, and opens the file in $EDITOR if set.
  This is the primary day-to-day command developers and AI agents use to
  begin a new piece of work.

acceptance_criteria:
  - "Given a feature name with spaces, when scaffolded, then the slug is lowercase with hyphens and no special characters."
  - "Given a new feature name, when `gh openspec scaffold 'user auth'` runs, then .openspec/specs/user-auth.spec.yaml is created."
  - "Given the created file, then it contains substituted values for FEATURE_NAME, SLUG, AUTHOR, DATE, and STATUS."
  - "Given a spec file already exists for the slug without --force, then the command exits with error."
  - "Given --type bugfix, then the bugfix.spec.yaml template is used."
  - "Given $EDITOR is set, then the spec file is opened in the editor after creation."
  - "Given .openspec/ does not exist, then the command exits with a clear error suggesting `gh openspec init`."

out_of_scope:
  - "Auto-filling spec content from issue descriptions (planned for v0.2)"

technical_notes: |
  Slugify: lowercase → spaces to hyphens → strip non-alphanum-hyphen → collapse
  double hyphens → trim leading/trailing hyphens.

