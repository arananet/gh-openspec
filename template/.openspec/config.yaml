# OpenSpec Configuration
# This file was generated by gh openspec.
# Complete setup by opening this project in Claude Code — it will guide you
# through the remaining {{PLACEHOLDER}} values via CLAUDE.md.

project:
  name: "{{PROJECT_NAME}}"
  owner: "{{GITHUB_OWNER}}"
  team: "{{TEAM_NAME}}"
  domain: "{{PROJECT_DOMAIN}}"
  description: "{{PROJECT_DESCRIPTION}}"

spec:
  required_fields:
    - title
    - description
    - acceptance_criteria
    - status
  enforce_on_pr: true
  enforce_on_commit: true
  min_acceptance_criteria: 1
  statuses:
    - draft
    - review
    - approved
  approved_required_for_merge: false

ci:
  fail_on_missing_spec: true
  fail_on_draft_spec: false
  notify_slack: false
  slack_webhook: ""

hooks:
  pre_commit:
    enabled: true
    block_if_no_spec: true
    warn_only: false
  commit_msg:
    enabled: true
    require_spec_reference: false
    pattern: "spec: <slug>"
